name: "[CI Build] New push!"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    name: Build ${{ matrix.arch }} (${{ matrix.build_type }})

    strategy:
      matrix:
        include:
          - arch: X64
            rid: win-x64
            dotnet_platform: x64
            build_type: Portable
          - arch: ARM64
            rid: win-arm64
            dotnet_platform: ARM64
            build_type: Portable
          - arch: X64
            rid: win-x64
            dotnet_platform: x64
            build_type: Release
          - arch: ARM64
            rid: win-arm64
            dotnet_platform: ARM64
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print trigger info
        shell: bash
        run: |
          echo "## [CI Build] New push!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **By**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from cfg.cs
        id: version
        shell: pwsh
        run: |
          $cs = Get-Content "cfg.cs" -Raw
          if ($cs -match 'AppVersionPrefix\s*=\s*"(.+?)"') {
            $prefix = $Matches[1]
          } else {
            Write-Error "Failed to parse version prefix"
            exit 1
          }
          if ($prefix -match '\[(\w+)\]\s+(\S+)') {
            $buildType = $Matches[1]
            $version   = $Matches[2]
          } else {
            Write-Error "Version prefix format mismatch: $prefix"
            exit 1
          }
          $now = [System.TimeZoneInfo]::ConvertTimeFromUtc(
            [DateTime]::UtcNow,
            [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time"))
          $buildNum = $now.ToString("yyMMddHHmm")
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          echo "build_type=$buildType"       >> $env:GITHUB_OUTPUT
          echo "version=$version"            >> $env:GITHUB_OUTPUT
          echo "build_num=$buildNum"         >> $env:GITHUB_OUTPUT
          echo "short_sha=$shortSha"         >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          $singleFile = ("${{ matrix.build_type }}" -eq "Portable")
          $outDir = "publish_${{ matrix.arch }}_${{ matrix.build_type }}"

          $publishArgs = @(
            "publish", "-c", "Release",
            "-p:Platform=${{ matrix.dotnet_platform }}",
            "-p:SelfContained=true",
            "-p:RuntimeIdentifier=${{ matrix.rid }}",
            "-o", $outDir
          )
          if ($singleFile) {
            $publishArgs += "-p:PublishSingleFile=true"
          }

          & dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $version  = "${{ steps.version.outputs.version }}"
          $buildNum = "${{ steps.version.outputs.build_num }}"
          $arch     = "${{ matrix.arch }}"
          $tag      = "${{ matrix.build_type }}"

          # Use simple names without spaces
          $name = "CIBuild_VTStudioToolBox_${version}_${buildNum}_${tag}_${arch}"

          if ($singleFile) {
            Copy-Item "$outDir/VTStudioToolBox.exe" "$name.exe"
          } else {
            Compress-Archive -Path "$outDir/*" -DestinationPath "$name.zip"
          }

          Write-Host "Created: $name"
          ls "$name.*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CIBuild_${{ matrix.build_type }}_${{ matrix.arch }}
          path: CIBuild_*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Create Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          version=$(grep -oP 'AppVersionPrefix\s*=\s*"\[Release\]\s+\K\S+' cfg.cs | tr -d ' ')
          build_num=$(TZ='Asia/Shanghai' date +'%y%m%d%H%M')
          short_sha="${GITHUB_SHA:0:7}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "build_num=${build_num}" >> $GITHUB_OUTPUT
          echo "tag=v${version}" >> $GITHUB_OUTPUT
          echo "name=[CI Build] Release ${version} (Build.${build_num})" >> $GITHUB_OUTPUT
          echo "short_sha=${short_sha}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: CIBuild_*
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Delete existing release if present
        continue-on-error: true
        run: gh release delete "${{ steps.version.outputs.tag }}" --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## ${{ steps.version.outputs.name }}

            > Triggered by `${{ github.actor }}` on commit `${{ steps.version.outputs.short_sha }}`

            ### Downloads
            | File | Arch | Type |
            |------|------|------|
            | `*_Portable_X64.exe` | x64 | Single-file |
            | `*_Portable_ARM64.exe` | ARM64 | Single-file |
            | `*_Release_X64.zip` | x64 | Folder |
            | `*_Release_ARM64.zip` | ARM64 | Folder |
          prerelease: false
          files: artifacts/*
