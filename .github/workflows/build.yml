name: "[CI Build] New push! By ${{ github.actor }} (${{ github.sha }})"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    name: Build ${{ matrix.arch }} (${{ matrix.build_type }})

    strategy:
      matrix:
        include:
          - arch: X64
            rid: win-x64
            dotnet_platform: x64
            build_type: Portable
          - arch: ARM64
            rid: win-arm64
            dotnet_platform: ARM64
            build_type: Portable
          - arch: X64
            rid: win-x64
            dotnet_platform: x64
            build_type: Release
          - arch: ARM64
            rid: win-arm64
            dotnet_platform: ARM64
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Extract version from cfg.cs
        id: version
        shell: pwsh
        run: |
          $cs = Get-Content "cfg.cs" -Raw
          if ($cs -match 'AppVersion\s*=\s*"(.+?)"') {
            $raw = $Matches[1]
          } else {
            Write-Error "Failed to parse version"
            exit 1
          }
          if ($raw -match '\[(\w+)\]\s+(\S+)\s+\((.+?)\)') {
            $buildType = $Matches[1]
            $version   = $Matches[2]
            $buildNum  = $Matches[3]
            $versionTag = "${version}(${buildNum})"
          } else {
            Write-Error "Version format mismatch: $raw"
            exit 1
          }
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          echo "build_type=$buildType"       >> $env:GITHUB_OUTPUT
          echo "version=$version"            >> $env:GITHUB_OUTPUT
          echo "build_num=$buildNum"         >> $env:GITHUB_OUTPUT
          echo "version_tag=$versionTag"     >> $env:GITHUB_OUTPUT
          echo "short_sha=$shortSha"         >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: |
          $singleFile = ("${{ matrix.build_type }}" -eq "Portable")
          $outDir = "publish_${{ matrix.arch }}_${{ matrix.build_type }}"

          $publishArgs = @(
            "publish", "-c", "Release",
            "-p:Platform=${{ matrix.dotnet_platform }}",
            "-p:SelfContained=true",
            "-p:RuntimeIdentifier=${{ matrix.rid }}",
            "-o", $outDir
          )
          if ($singleFile) {
            $publishArgs += "-p:PublishSingleFile=true"
          }

          & dotnet @publishArgs
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $versionTag = "${{ steps.version.outputs.version_tag }}"
          $buildType  = "${{ steps.version.outputs.build_type }}"
          $shortSha   = "${{ steps.version.outputs.short_sha }}"
          $arch       = "${{ matrix.arch }}"
          $tag        = "${{ matrix.build_type }}"
          $name       = "[CI Build] ${buildType}_VTStudioToolBox_${versionTag}_${tag}_${arch}"

          if ($singleFile) {
            Copy-Item "$outDir/VTStudioToolBox.exe" "$name.exe"
          } else {
            Compress-Archive -Path "$outDir/*" -DestinationPath "$name.zip"
          }
          echo "ARTIFACT_NAME=$name" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}.exe
            ${{ env.ARTIFACT_NAME }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Create Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          version=$(grep -oP 'AppVersion\s*=\s*"\[Release\]\s+\K[^(]+' cfg.cs | tr -d ' ')
          build_num=$(grep -oP 'Build\.\K[^)]+' cfg.cs)
          short_sha="${GITHUB_SHA:0:7}"
          echo "tag=v${version}" >> $GITHUB_OUTPUT
          echo "name=[CI Build] Release ${version} (Build.${build_num})" >> $GITHUB_OUTPUT
          echo "short_sha=${short_sha}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## ${{ steps.version.outputs.name }}

            > Triggered by `${{ github.actor }}` on commit `${{ steps.version.outputs.short_sha }}`

            ### Downloads
            | File | Arch | Type |
            |------|------|------|
            | `[CI Build] *_Portable_X64.exe` | x64 | Single-file |
            | `[CI Build] *_Portable_ARM64.exe` | ARM64 | Single-file |
            | `[CI Build] *_Release_X64.zip` | x64 | Portable folder |
            | `[CI Build] *_Release_ARM64.zip` | ARM64 | Portable folder |
          prerelease: false
          files: artifacts/*
