name: "[Store Build] Release MSIX"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    name: Build ${{ matrix.arch }} MSIX

    strategy:
      matrix:
        include:
          - arch: X64
            rid: win-x64
            dotnet_platform: x64
          - arch: ARM64
            rid: win-arm64
            dotnet_platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Print trigger info
        shell: bash
        run: |
          echo "## [Store Build] Release MSIX" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **By**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from cfg.cs
        id: version
        shell: pwsh
        run: |
          $cs = Get-Content "cfg.cs" -Raw
          if ($cs -match 'AppVersion\s*=\s*"(.+?)"') {
            $prefix = $Matches[1]
          } else {
            Write-Error "Failed to parse version prefix"
            exit 1
          }
          if ($prefix -match '\[(\w+)\]\s+(\S+)') {
            $buildType = $Matches[1]
            $version   = $Matches[2]
          } else {
            Write-Error "Version prefix format mismatch: $prefix"
            exit 1
          }
          $now = [System.TimeZoneInfo]::ConvertTimeFromUtc(
            [DateTime]::UtcNow,
            [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time"))
          $buildNum = $now.ToString("yyMMddHHmm")
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          echo "build_type=$buildType"       >> $env:GITHUB_OUTPUT
          echo "version=$version"            >> $env:GITHUB_OUTPUT
          echo "build_num=$buildNum"         >> $env:GITHUB_OUTPUT
          echo "short_sha=$shortSha"         >> $env:GITHUB_OUTPUT

      - name: Delete Tools (keep platform-tools)
        shell: pwsh
        run: |
          if (Test-Path "Tools") {
            Get-ChildItem "Tools" -Recurse | Remove-Item -Recurse -Force
            Write-Host "Cleared Tools/ directory contents"
          }
          if (Test-Path "platform-tools") {
            $count = (Get-ChildItem "platform-tools" -Recurse -File).Count
            Write-Host "platform-tools/ preserved ($count files)"
          } else {
            Write-Warning "platform-tools/ directory not found"
          }

      - name: Patch csproj for Store MSIX
        shell: pwsh
        run: |
          $csproj = "VTStudioToolBox.csproj"
          $xml = [xml](Get-Content $csproj -Raw)

          # 1. Remove all Tools Content references
          $allContent = $xml.SelectNodes("//Content[@Include]")
          $removed = 0
          foreach ($node in $allContent) {
            $inc = $node.GetAttribute("Include")
            if ($inc -match '^Tools\\') {
              $node.ParentNode.RemoveChild($node) | Out-Null
              $removed++
              Write-Host "  Removed: $inc"
            }
          }
          Write-Host "Removed $removed Tools Content references from csproj"

          # 2. Set WindowsPackageType to MSIX
          $propGroup = $xml.SelectSingleNode("//PropertyGroup[1]")
          if (-not $propGroup) {
            Write-Error "No PropertyGroup found in csproj"
            exit 1
          }
          $wpt = $propGroup.SelectSingleNode("WindowsPackageType")
          if ($wpt) {
            $wpt.InnerText = "MSIX"
            Write-Host "Changed WindowsPackageType to MSIX"
          } else {
            $wpt = $xml.CreateElement("WindowsPackageType")
            $wpt.InnerText = "MSIX"
            $propGroup.AppendChild($wpt) | Out-Null
            Write-Host "Added WindowsPackageType=MSIX"
          }

          $xml.Save($csproj)
          Write-Host "csproj patched successfully"

      - name: Generate self-signed certificate
        shell: pwsh
        run: |
          $certPwd = ConvertTo-SecureString -String "CIBuild" -Force -AsPlainText
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=VTStudioToolBox CI Build" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(1) `
            -KeyUsage DigitalSignature

          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "CI_Build_Signing.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $certPwd -Force | Out-Null

          Write-Host "Generated certificate: $($cert.Thumbprint)"
          Write-Host "PFX exported to: $pfxPath"

          echo "cert_thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          echo "cert_pfx_path=$pfxPath" >> $env:GITHUB_OUTPUT
          echo "cert_password=CIBuild" >> $env:GITHUB_OUTPUT
        id: cert

      - name: Build MSIX with StoreUpload + self-sign
        id: build
        shell: pwsh
        run: |
          $platform = "${{ matrix.dotnet_platform }}"
          $arch = "${{ matrix.arch }}"
          $rid = "${{ matrix.rid }}"
          $thumbprint = "${{ steps.cert.outputs.cert_thumbprint }}"
          $pfxPath = "${{ steps.cert.outputs.cert_pfx_path }}"
          $pfxPassword = "${{ steps.cert.outputs.cert_password }}"

          # Restore
          dotnet restore VTStudioToolBox.csproj -p:Platform=$platform -r $rid
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Build with StoreUpload properties — do NOT use -o (let MSBuild use default AppPackages output)
          dotnet build VTStudioToolBox.csproj -c Release `
            -p:Platform=$platform `
            -p:RuntimeIdentifier=$rid `
            -p:SelfContained=true `
            -p:WindowsPackageType=MSIX `
            -p:UapAppxPackageBuildMode=StoreUpload `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms="$arch" `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=$thumbprint `
            -p:PackageCertificatePassword=$pfxPassword `
            -p:AppxTestStoreUpload=true
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Search for generated .msixupload (may be in AppPackages or bin)
          $msixupload = Get-ChildItem -Path . -Filter "*.msixupload" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msixupload) {
            Write-Host "Found .msixupload: $($msixupload.FullName)"
            echo "msixupload_path=$($msixupload.FullName)" >> $env:GITHUB_OUTPUT
            echo "has_msixupload=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "No .msixupload found. Searching for .msix and .appxbundle..."
            echo "has_msixupload=false" >> $env:GITHUB_OUTPUT
            Get-ChildItem -Path . -Include "*.msix","*.msixbundle","*.appxbundle","*.msixupload" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "  Found: $($_.FullName) ($([math]::Round($_.Length/1MB,2)) MB)"
            }
          }

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StoreBuild_${{ matrix.arch }}
          path: |
            **/*.msixupload
            **/*.msixbundle
            **/*.msix
            **/*.appxupload
          if-no-files-found: warning

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Create Store Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          version=$(grep -oP 'AppVersion\s*=\s*"\[Release\]\s+\K\S+' cfg.cs | tr -d ' ')
          build_num=$(TZ='Asia/Shanghai' date +'%y%m%d%H%M')
          short_sha="${GITHUB_SHA:0:7}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "build_num=${build_num}" >> $GITHUB_OUTPUT
          echo "tag=store-v${version}" >> $GITHUB_OUTPUT
          echo "name=[Store Build] Release ${version} (Build.${build_num})" >> $GITHUB_OUTPUT
          echo "short_sha=${short_sha}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: StoreBuild_*
          merge-multiple: true

      - name: List all downloaded files
        run: find artifacts -type f -printf '%s %p\n' | sort -rn

      - name: Prepare release files
        id: prepare
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          build_num="${{ steps.version.outputs.build_num }}"
          prefix="StoreBuild_VTStudioToolBox_${version}_${build_num}"

          has_files=false

          # Copy and rename .msixupload
          for f in $(find artifacts -name "*.msixupload" -type f); do
            cp "$f" "${prefix}.msixupload"
            echo "Release file: ${prefix}.msixupload ($(du -h "$f" | cut -f1))"
            has_files=true
          done

          # Copy and rename .msixbundle
          for f in $(find artifacts -name "*.msixbundle" -type f); do
            cp "$f" "${prefix}.msixbundle"
            echo "Release file: ${prefix}.msixbundle ($(du -h "$f" | cut -f1))"
            has_files=true
          done

          # Copy and rename individual .msix files
          for f in $(find artifacts -name "*.msix" -type f); do
            arch=$(echo "$f" | grep -ioP '(x64|arm64)' | head -1 || echo "unknown")
            arch=$(echo "$arch" | tr '[:lower:]' '[:upper:]')
            cp "$f" "${prefix}_${arch}.msix"
            echo "Release file: ${prefix}_${arch}.msix ($(du -h "$f" | cut -f1))"
            has_files=true
          done

          echo "has_files=${has_files}" >> $GITHUB_OUTPUT
          echo "---"
          ls -lh StoreBuild_* 2>/dev/null || echo "No release files found"

      - name: Delete existing release if present
        continue-on-error: true
        run: gh release delete "${{ steps.version.outputs.tag }}" --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.prepare.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## ${{ steps.version.outputs.name }}

            > Triggered by `${{ github.actor }}` on commit `${{ steps.version.outputs.short_sha }}`

            ### Store Build
            This build **excludes** the Tools directory (实用工具) — suitable for Microsoft Store submission.
            Packages are **self-signed** with a CI-generated test certificate for local sideloading.

            ### Downloads
            | File | Description |
            |------|-------------|
            | `*.msixupload` | Store submission bundle (for Microsoft Partner Center) |
            | `*.msixbundle` | Multi-architecture bundle (for sideloading) |
            | `*.msix` | Individual architecture MSIX package |

            ### Install for testing
            1. Download the `.msix` or `.msixbundle` file
            2. Double-click to install (self-signed certificate allows local testing)
            3. Or use: `Add-AppxPackage -Path <file>.msix`
          prerelease: false
          files: |
            StoreBuild_*.msixupload
            StoreBuild_*.msixbundle
            StoreBuild_*.msix
