name: "[Store Build] Release MSIX"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    name: Build ${{ matrix.arch }} MSIX

    strategy:
      matrix:
        include:
          - arch: X64
            rid: win-x64
            dotnet_platform: x64
          - arch: ARM64
            rid: win-arm64
            dotnet_platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Print trigger info
        shell: bash
        run: |
          echo "## [Store Build] Release MSIX" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **By**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from cfg.cs
        id: version
        shell: pwsh
        run: |
          $cs = Get-Content "cfg.cs" -Raw
          if ($cs -match 'AppVersion\s*=\s*"(.+?)"') {
            $prefix = $Matches[1]
          } else {
            Write-Error "Failed to parse version prefix"
            exit 1
          }
          if ($prefix -match '\[(\w+)\]\s+(\S+)') {
            $buildType = $Matches[1]
            $version   = $Matches[2]
          } else {
            Write-Error "Version prefix format mismatch: $prefix"
            exit 1
          }
          $now = [System.TimeZoneInfo]::ConvertTimeFromUtc(
            [DateTime]::UtcNow,
            [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time"))
          $buildNum = $now.ToString("yyMMddHHmm")
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          echo "build_type=$buildType"       >> $env:GITHUB_OUTPUT
          echo "version=$version"            >> $env:GITHUB_OUTPUT
          echo "build_num=$buildNum"         >> $env:GITHUB_OUTPUT
          echo "short_sha=$shortSha"         >> $env:GITHUB_OUTPUT

      - name: Delete Tools (keep platform-tools)
        shell: pwsh
        run: |
          if (Test-Path "Tools") {
            Get-ChildItem "Tools" -Recurse | Remove-Item -Recurse -Force
            Write-Host "Cleared Tools/ directory contents"
          }
          if (Test-Path "platform-tools") {
            $count = (Get-ChildItem "platform-tools" -Recurse -File).Count
            Write-Host "platform-tools/ preserved ($count files)"
          } else {
            Write-Warning "platform-tools/ directory not found"
          }

      - name: Patch app.manifest for MSIX compatibility
        shell: pwsh
        run: |
          # MSIX does not support requireAdministrator — change to asInvoker
          $manifest = "app.manifest"
          $content = Get-Content $manifest -Raw
          if ($content -match 'requireAdministrator') {
            $content = $content -replace 'requireAdministrator', 'asInvoker'
            Set-Content $manifest -Value $content -NoNewline
            Write-Host "Patched app.manifest: requireAdministrator -> asInvoker"
          } else {
            Write-Host "app.manifest already uses asInvoker"
          }

      - name: Patch csproj for Store MSIX
        shell: pwsh
        run: |
          $csproj = "VTStudioToolBox.csproj"
          $xml = [xml](Get-Content $csproj -Raw)

          # 1. Remove all Tools Content references
          $allContent = $xml.SelectNodes("//Content[@Include]")
          $removed = 0
          foreach ($node in $allContent) {
            $inc = $node.GetAttribute("Include")
            if ($inc -match '^Tools\\') {
              $node.ParentNode.RemoveChild($node) | Out-Null
              $removed++
              Write-Host "  Removed: $inc"
            }
          }
          Write-Host "Removed $removed Tools Content references from csproj"

          # 2. Set WindowsPackageType to MSIX
          $propGroup = $xml.SelectSingleNode("//PropertyGroup[1]")
          $wpt = $propGroup.SelectSingleNode("WindowsPackageType")
          if ($wpt) {
            $wpt.InnerText = "MSIX"
          } else {
            $wpt = $xml.CreateElement("WindowsPackageType")
            $wpt.InnerText = "MSIX"
            $propGroup.AppendChild($wpt) | Out-Null
          }
          Write-Host "Set WindowsPackageType=MSIX"

          $xml.Save($csproj)

      - name: Generate self-signed certificate
        id: cert
        shell: pwsh
        run: |
          # Subject MUST match Package.appxmanifest Publisher: CN=KL_Xydwg01
          $certPwd = ConvertTo-SecureString -String "CIBuild" -Force -AsPlainText
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=KL_Xydwg01" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(1) `
            -KeyUsage DigitalSignature

          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "CI_Build_Signing.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $certPwd -Force | Out-Null

          # Install to trusted stores so MSIX is trusted on this runner
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\LocalMachine\Root" -Password $certPwd -Exportable | Out-Null
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" -Password $certPwd -Exportable | Out-Null

          Write-Host "Certificate Subject: CN=KL_Xydwg01 (must match manifest Publisher)"
          Write-Host "Thumbprint: $($cert.Thumbprint)"

          echo "cert_thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
          echo "cert_pfx_path=$pfxPath" >> $env:GITHUB_OUTPUT
          echo "cert_password=CIBuild" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        shell: pwsh
        run: |
          $platform = "${{ matrix.dotnet_platform }}"
          $rid = "${{ matrix.rid }}"
          $thumbprint = "${{ steps.cert.outputs.cert_thumbprint }}"
          $pfxPassword = "${{ steps.cert.outputs.cert_password }}"

          dotnet restore VTStudioToolBox.csproj -p:Platform=$platform -r $rid
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Build with MSIX packaging enabled
          dotnet build VTStudioToolBox.csproj -c Release `
            -p:Platform=$platform `
            -p:RuntimeIdentifier=$rid `
            -p:SelfContained=true `
            -p:WindowsPackageType=MSIX `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint=$thumbprint `
            -p:PackageCertificatePassword=$pfxPassword
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Find generated .msix
          $msixFiles = Get-ChildItem -Path . -Filter "*.msix" -Recurse -ErrorAction SilentlyContinue
          Write-Host "Found $($msixFiles.Count) .msix file(s):"
          $msixFiles | ForEach-Object { Write-Host "  $($_.FullName) ($([math]::Round($_.Length/1MB,2)) MB)" }

          if ($msixFiles.Count -eq 0) {
            Write-Error "No .msix files generated!"
            exit 1
          }

          # Copy .msix to a clean output directory for artifact upload
          $outDir = "msix_output"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          foreach ($f in $msixFiles) {
            Copy-Item $f.FullName "$outDir/$($f.Name)"
            Write-Host "Copied: $($f.Name)"
          }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoreBuild_${{ matrix.arch }}
          path: msix_output/*.msix
          if-no-files-found: error

  bundle:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    name: Bundle & Release (.msixupload)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $cs = Get-Content "cfg.cs" -Raw
          if ($cs -match '\[Release\]\s+(\S+)') {
            $version = $Matches[1].Trim()
          } else {
            $version = "0.0.0"
          }
          $now = [System.TimeZoneInfo]::ConvertTimeFromUtc(
            [DateTime]::UtcNow,
            [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time"))
          $buildNum = $now.ToString("yyMMddHHmm")
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "build_num=$buildNum" >> $env:GITHUB_OUTPUT
          echo "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          echo "tag=store-v$version" >> $env:GITHUB_OUTPUT
          echo "name=[Store Build] Release $version (Build.$buildNum)" >> $env:GITHUB_OUTPUT

      - name: Download all MSIX artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: StoreBuild_*
          merge-multiple: true

      - name: List downloaded artifacts
        shell: pwsh
        run: Get-ChildItem -Path artifacts -Recurse -File | ForEach-Object { Write-Host "$($_.FullName) ($([math]::Round($_.Length/1MB,2)) MB)" }

      - name: Create .msixbundle and .msixupload
        id: bundle
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $buildNum = "${{ steps.version.outputs.build_num }}"
          $prefix = "StoreBuild_VTStudioToolBox_${version}_${buildNum}"

          # Locate MakeAppx.exe from Windows SDK
          $sdkRoot = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.*" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $makeappx = Join-Path $sdkRoot "x64\MakeAppx.exe"
          if (-not (Test-Path $makeappx)) {
            Write-Error "MakeAppx.exe not found at $makeappx"
            exit 1
          }
          Write-Host "Using MakeAppx: $makeappx"

          # Find all .msix files
          $msixFiles = Get-ChildItem -Path artifacts -Filter "*.msix" -Recurse
          if ($msixFiles.Count -eq 0) {
            Write-Error "No .msix files found in artifacts"
            exit 1
          }
          Write-Host "Found $($msixFiles.Count) .msix file(s)"

          # Step 1: Create .msixbundle from all .msix files
          $bundleMappingDir = "bundle_mapping"
          New-Item -ItemType Directory -Path $bundleMappingDir -Force | Out-Null

          # Create bundle mapping file
          $mappingContent = ""
          foreach ($f in $msixFiles) {
            # Extract architecture from filename
            $arch = "neutral"
            if ($f.Name -match "x64|X64") { $arch = "x64" }
            elseif ($f.Name -match "arm64|ARM64") { $arch = "ARM64" }
            $mappingContent += "$arch`r`n$($f.FullName)`r`n`r`n"
          }
          $mappingFile = Join-Path $bundleMappingDir "mapping.txt"
          Set-Content -Path $mappingFile -Value $mappingContent -NoNewline
          Write-Host "Bundle mapping:"
          Get-Content $mappingFile | ForEach-Object { Write-Host "  $_" }

          $bundleFile = "${prefix}.msixbundle"
          & $makeappx bundle /d $bundleMappingDir /p $bundleFile /o
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MakeAppx bundle failed"
            exit 1
          }
          Write-Host "Created bundle: $bundleFile ($([math]::Round((Get-Item $bundleFile).Length/1MB,2)) MB)"

          # Step 2: Sign the bundle with the same CI cert
          $pfxPath = "CI_Build_Signing.pfx"
          if (Test-Path $pfxPath) {
            $signtool = Join-Path $sdkRoot "x64\signtool.exe"
            if (Test-Path $signtool) {
              & $signtool sign /f $pfxPath /p "CIBuild" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $bundleFile
              if ($LASTEXITCODE -eq 0) {
                Write-Host "Signed bundle successfully"
              } else {
                Write-Warning "Bundle signing failed (non-fatal)"
              }
            }
          }

          # Step 3: Create .msixupload (zip of the bundle + uploadmapping.xml)
          $uploadDir = "upload_staging"
          New-Item -ItemType Directory -Path $uploadDir -Force | Out-Null
          Copy-Item $bundleFile $uploadDir -Force

          # Create uploadmapping.xml required by Partner Center
          $uploadXml = '<?xml version="1.0" encoding="utf-8"?>' + "`r`n"
          $uploadXml += '<UploadMapping xmlns="http://schemas.microsoft.com/appx/2010/uploadmapping">' + "`r`n"
          $uploadXml += '  <Package>' + "`r`n"
          $uploadXml += "    <Architecture>neutral</Architecture>`r`n"
          $uploadXml += "    <FileName>$bundleFile</FileName>`r`n"
          $uploadXml += '  </Package>' + "`r`n"
          $uploadXml += '</UploadMapping>'
          Set-Content -Path (Join-Path $uploadDir "uploadmapping.xml") -Value $uploadXml -Encoding UTF8

          $msixupload = "${prefix}.msixupload"
          Compress-Archive -Path "$uploadDir/*" -DestinationPath $msixupload -Force
          Write-Host "Created .msixupload: $msixupload ($([math]::Round((Get-Item $msixupload).Length/1MB,2)) MB)"

          # Also rename individual .msix files
          foreach ($f in $msixFiles) {
            $arch = "Unknown"
            if ($f.Name -match "x64|X64") { $arch = "X64" }
            elseif ($f.Name -match "arm64|ARM64") { $arch = "ARM64" }
            $dest = "${prefix}_${arch}.msix"
            Copy-Item $f.FullName $dest -Force
            Write-Host "Release: $dest"
          }

          # List all release files
          Write-Host "`n=== Release files ==="
          Get-ChildItem -Path . -Filter "StoreBuild_*" -File | ForEach-Object {
            Write-Host "  $($_.Name) ($([math]::Round($_.Length/1MB,2)) MB)"
          }

      - name: Delete existing release if present
        continue-on-error: true
        run: gh release delete "${{ steps.version.outputs.tag }}" --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## ${{ steps.version.outputs.name }}

            > Triggered by `${{ github.actor }}` on commit `${{ steps.version.outputs.short_sha }}`

            ### Store Build
            This build **excludes** the Tools directory (实用工具) — suitable for Microsoft Store submission.
            Packages are **self-signed** with a CI-generated test certificate matching the app Publisher.

            ### Downloads
            | File | Description |
            |------|-------------|
            | `*.msixupload` | Store submission bundle (for Microsoft Partner Center) |
            | `*.msixbundle` | Multi-architecture bundle (for sideloading) |
            | `*.msix` | Individual architecture MSIX package |

            ### How to install (sideloading)
            1. Enable **Developer Mode**: Settings → Privacy & Security → For developers → Developer Mode ON
            2. Download the `.msix` or `.msixbundle` file
            3. Right-click the file → Properties → Digital Signatures → View Certificate → Install Certificate → **Trusted Root Certification Authorities**
            4. Double-click the file to install
          prerelease: false
          files: |
            StoreBuild_*.msixupload
            StoreBuild_*.msixbundle
            StoreBuild_*.msix
