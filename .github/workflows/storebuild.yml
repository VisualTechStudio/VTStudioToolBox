name: "[Store Build] Release MSIX"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    name: Build ${{ matrix.arch }} MSIX

    strategy:
      matrix:
        include:
          - arch: X64
            rid: win-x64
            dotnet_platform: x64
          - arch: ARM64
            rid: win-arm64
            dotnet_platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Print trigger info
        shell: bash
        run: |
          echo "## [Store Build] Release MSIX" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **By**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from cfg.cs
        id: version
        shell: pwsh
        run: |
          $cs = Get-Content "cfg.cs" -Raw
          if ($cs -match 'AppVersion\s*=\s*"(.+?)"') {
            $prefix = $Matches[1]
          } else {
            Write-Error "Failed to parse version prefix"
            exit 1
          }
          if ($prefix -match '\[(\w+)\]\s+(\S+)') {
            $buildType = $Matches[1]
            $version   = $Matches[2]
          } else {
            Write-Error "Version prefix format mismatch: $prefix"
            exit 1
          }
          $now = [System.TimeZoneInfo]::ConvertTimeFromUtc(
            [DateTime]::UtcNow,
            [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time"))
          $buildNum = $now.ToString("yyMMddHHmm")
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          echo "build_type=$buildType"       >> $env:GITHUB_OUTPUT
          echo "version=$version"            >> $env:GITHUB_OUTPUT
          echo "build_num=$buildNum"         >> $env:GITHUB_OUTPUT
          echo "short_sha=$shortSha"         >> $env:GITHUB_OUTPUT

      - name: Delete Tools (keep platform-tools)
        shell: pwsh
        run: |
          # Remove all contents under Tools/ but preserve the directory itself
          if (Test-Path "Tools") {
            Get-ChildItem "Tools" -Recurse | Remove-Item -Recurse -Force
            Write-Host "Cleared Tools/ directory contents"
          }
          # Verify platform-tools still exists
          if (Test-Path "platform-tools") {
            $count = (Get-ChildItem "platform-tools" -Recurse -File).Count
            Write-Host "platform-tools/ preserved ($count files)"
          } else {
            Write-Warning "platform-tools/ directory not found"
          }

      - name: Patch csproj for Store MSIX
        shell: pwsh
        run: |
          $csproj = "VTStudioToolBox.csproj"
          $xml = [xml](Get-Content $csproj -Raw)

          # 1. Remove all Tools Content references (SDK-style csproj has no namespace)
          $allContent = $xml.SelectNodes("//Content[@Include]")
          $removed = 0
          foreach ($node in $allContent) {
            $inc = $node.GetAttribute("Include")
            # Match Tools\xxx but NOT platform-tools\xxx
            if ($inc -match '^Tools\\') {
              $node.ParentNode.RemoveChild($node) | Out-Null
              $removed++
              Write-Host "  Removed: $inc"
            }
          }
          Write-Host "Removed $removed Tools Content references from csproj"

          # 2. Set WindowsPackageType to MSIX in the first PropertyGroup
          $propGroup = $xml.SelectSingleNode("//PropertyGroup[1]")
          if (-not $propGroup) {
            Write-Error "No PropertyGroup found in csproj"
            exit 1
          }
          $wpt = $propGroup.SelectSingleNode("WindowsPackageType")
          if ($wpt) {
            $wpt.InnerText = "MSIX"
            Write-Host "Changed WindowsPackageType to MSIX"
          } else {
            $wpt = $xml.CreateElement("WindowsPackageType")
            $wpt.InnerText = "MSIX"
            $propGroup.AppendChild($wpt) | Out-Null
            Write-Host "Added WindowsPackageType=MSIX"
          }

          $xml.Save($csproj)
          Write-Host "csproj patched successfully"

      - name: Build with MSBuild (StoreUpload)
        shell: pwsh
        run: |
          $platform = "${{ matrix.dotnet_platform }}"
          $arch = "${{ matrix.arch }}"
          $rid = "${{ matrix.rid }}"

          # Restore NuGet packages (explicit csproj to avoid slnx RID restriction)
          dotnet restore VTStudioToolBox.csproj -p:Platform=$platform -r $rid
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Build with MSBuild properties for Store packaging
          dotnet build VTStudioToolBox.csproj -c Release `
            -p:Platform=$platform `
            -p:RuntimeIdentifier=$rid `
            -p:SelfContained=true `
            -p:WindowsPackageType=MSIX `
            -p:UapAppxPackageBuildMode=StoreUpload `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms="$arch" `
            -p:GenerateAppxPackageOnBuild=true
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Find generated .msixupload file
          $msixupload = Get-ChildItem -Path . -Filter "*.msixupload" -Recurse | Select-Object -First 1
          if ($msixupload) {
            Write-Host "Found msixupload: $($msixupload.FullName)"
            echo "msixupload_path=$($msixupload.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "No .msixupload found, looking for .msix files..."
            Get-ChildItem -Path . -Filter "*.msix" -Recurse | ForEach-Object { Write-Host "  $_" }
          }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoreBuild_${{ matrix.arch }}
          path: |
            **/*.msixupload
            **/*.msix
            **/*.appxupload

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Create Store Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          version=$(grep -oP 'AppVersion\s*=\s*"\[Release\]\s+\K\S+' cfg.cs | tr -d ' ')
          build_num=$(TZ='Asia/Shanghai' date +'%y%m%d%H%M')
          short_sha="${GITHUB_SHA:0:7}"
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "build_num=${build_num}" >> $GITHUB_OUTPUT
          echo "tag=store-v${version}" >> $GITHUB_OUTPUT
          echo "name=[Store Build] Release ${version} (Build.${build_num})" >> $GITHUB_OUTPUT
          echo "short_sha=${short_sha}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: StoreBuild_*
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -type f | head -50

      - name: Rename artifacts
        id: rename
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          build_num="${{ steps.version.outputs.build_num }}"
          renamed=()

          # Rename .msixupload files
          for f in $(find artifacts -name "*.msixupload" -type f); do
            arch=$(echo "$f" | grep -ioP '(x64|arm64)' | head -1 || echo "bundle")
            arch=$(echo "$arch" | tr '[:lower:]' '[:upper:]')
            dest="StoreBuild_VTStudioToolBox_${version}_${build_num}_${arch}.msixupload"
            cp "$f" "$dest"
            renamed+=("$dest")
            echo "Renamed: $dest"
          done

          # Rename individual .msix files
          for f in $(find artifacts -name "*.msix" -type f); do
            arch=$(echo "$f" | grep -ioP '(x64|arm64)' | head -1 || echo "unknown")
            arch=$(echo "$arch" | tr '[:lower:]' '[:upper:]')
            dest="StoreBuild_VTStudioToolBox_${version}_${build_num}_${arch}.msix"
            cp "$f" "$dest"
            renamed+=("$dest")
            echo "Renamed: $dest"
          done

          if [ ${#renamed[@]} -eq 0 ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
          else
            echo "has_files=true" >> $GITHUB_OUTPUT
          fi

      - name: Delete existing release if present
        continue-on-error: true
        run: gh release delete "${{ steps.version.outputs.tag }}" --yes --cleanup-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.rename.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## ${{ steps.version.outputs.name }}

            > Triggered by `${{ github.actor }}` on commit `${{ steps.version.outputs.short_sha }}`

            ### Store Build
            This build **excludes** the Tools directory (实用工具) — suitable for Microsoft Store submission.

            ### Downloads
            | File | Description |
            |------|-------------|
            | `*.msixupload` | Store submission bundle (for Microsoft Partner Center) |
            | `*.msix` | Individual MSIX package (for sideloading / testing) |

            ### Notes
            - `.msixupload` is the format required by Microsoft Partner Center for Store submission
            - Individual `.msix` files can be sideloaded for testing
          prerelease: false
          files: |
            StoreBuild_*.msixupload
            StoreBuild_*.msix
